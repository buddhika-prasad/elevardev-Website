<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-orange">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Orange glow behind arrow -->
    <radialGradient id="orangeGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <!-- Blue glow behind dev -->
    <radialGradient id="blueGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background glows -->
  <ellipse cx="30" cy="60" rx="25" ry="25" fill="url(#orangeGlow)"/>
  <ellipse cx="100" cy="60" rx="20" ry="20" fill="url(#blueGlow)"/>
  
  <!-- Arrow Symbol -->
  <!-- Arrow base (blue with 3D effect) -->
  <path
    d="M30 90 L46 74 L46 105 L30 90 Z"
    fill="#3B82F6"
    filter="url(#glow-blue)"
  />
  <path
    d="M30 90 L40 80 L46 88 L30 90 Z"
    fill="#2563EB"
    opacity="0.8"
  />
  
  <!-- Arrow shaft (lighter blue) -->
  <path
    d="M46 74 L62 58 L62 74 L46 74 Z"
    fill="#60A5FA"
  />
  <!-- Shaft highlight -->
  <path
    d="M52 68 L58 62 L58 68 L52 68 Z"
    fill="#93C5FD"
    opacity="0.7"
  />
  
  <!-- Arrowhead (orange) -->
  <path
    d="M62 58 L78 70 L62 82 L62 58 Z"
    fill="#F97316"
    filter="url(#glow-orange)"
  />
  <!-- Arrowhead highlight -->
  <path
    d="M62 58 L70 66 L62 74 L62 58 Z"
    fill="#FB923C"
    opacity="0.9"
  />
  <path
    d="M70 66 L74 68 L70 72 L70 66 Z"
    fill="#FCD34D"
    opacity="0.6"
  />
</svg>

